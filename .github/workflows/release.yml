name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app and package
        run: bash scripts/make_release.sh "${GITHUB_REF_NAME#v}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Batch Audio Converter ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md
